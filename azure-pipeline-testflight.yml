# azure-pipelines-testflight-auth-fixed.yml
# Enhanced pipeline with authentication debugging and error handling

name: TestFlight-AuthFixed-$(Date:yyyyMMdd)-$(Rev:r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - build/*.ipa

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  - group: iOS-Signing-Assets
  - name: bundleId
    value: 'com.gleidsonlm.businesscard'
  - name: appName
    value: 'Business Card'
  - name: ipaFileName
    value: 'BusinessCard.ipa'

parameters:
  - name: deploymentEnvironment
    displayName: 'Deployment Environment'
    type: string
    default: 'UAT'
    values:
      - 'UAT'
      - 'PRODUCTION'

stages:
  - stage: AuthenticationValidation
    displayName: 'Authentication Validation and Setup'
    jobs:
      - job: ValidateAPIKey
        displayName: 'Validate App Store Connect API Key'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          # Updated validation task with correct API Key ID format
          - task: Bash@3
            displayName: 'API Key Configuration Validation - Corrected Format'
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                set -e
                
                echo "=== Corrected API Key Format Validation ==="
                echo "Date: 2025-08-18 17:47:23"
                echo "User: gleidsonlm"
                echo "Reference: Official Apple Developer Documentation"
                echo ""
                
                # Get API key variables
                API_KEY_ID="$(myApiKeyId)"
                API_KEY_ISSUER_ID="$(myApiKeyIssuerId)"
                API_TOKEN="$(myApitoken)"
                APP_SPECIFIC_ID="$(myAppSpecificId)"
                
                echo "🔍 Validating against official Apple specifications..."
                echo ""
                
                # Validate Key ID format (CORRECTED: 10 characters, not 8)
                echo "Key ID Validation:"
                echo "   Value: $API_KEY_ID"
                echo "   Length: ${#API_KEY_ID} characters"
                
                if [[ ${#API_KEY_ID} -eq 10 ]] && [[ "$API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
                    echo "   ✅ Format valid (10 characters, uppercase alphanumeric)"
                else
                    echo "   ❌ Format invalid"
                    echo "   Expected: 10 characters, uppercase letters and digits only"
                    echo "   Pattern: ^[A-Z0-9]{10}$"
                    echo "   Examples: 2X9R4HXF34, D383SF739, L5U8RELVLS"
                    exit 1
                fi
                
                # Validate Issuer ID format (unchanged)
                echo ""
                echo "Issuer ID Validation:"
                echo "   Value: $API_KEY_ISSUER_ID"
                echo "   Length: ${#API_KEY_ISSUER_ID} characters"
                
                if [[ "$API_KEY_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
                    echo "   ✅ Format valid (UUID format)"
                else
                    echo "   ❌ Format invalid"
                    echo "   Expected: UUID format (8-4-4-4-12 character groups)"
                    echo "   Example: 69a6de80-cfbd-47ef-9fba-8891c78f413e"
                    exit 1
                fi
                
                # Validate API token format (unchanged)
                echo ""
                echo "API Token Validation:"
                echo "   Length: ${#API_TOKEN} characters"
                
                if [[ ${#API_TOKEN} -ge 200 ]] && [[ ${#API_TOKEN} -le 600 ]]; then
                    echo "   ✅ Length reasonable (200-600 characters expected)"
                else
                    echo "   ❌ Length unexpected"
                    echo "   Expected: 200-600 characters (base64-encoded .p8 content)"
                    exit 1
                fi
                
                # Validate base64 format
                if echo "$API_TOKEN" | base64 -d > /dev/null 2>&1; then
                    echo "   ✅ Valid base64 format"
                else
                    echo "   ❌ Invalid base64 format"
                    echo "   💡 Re-encode: base64 -i AuthKey_$API_KEY_ID.p8"
                    exit 1
                fi
                
                # Validate App Specific ID (unchanged)
                echo ""
                echo "App Specific ID Validation:"
                echo "   Value: $APP_SPECIFIC_ID"
                
                if [[ "$APP_SPECIFIC_ID" =~ ^[0-9]+$ ]]; then
                    echo "   ✅ Format valid (numeric)"
                else
                    echo "   ❌ Format invalid (expected numeric)"
                    exit 1
                fi
                
                echo ""
                echo "✅ All API key components validated against official Apple specifications"
                echo "🔄 Proceeding with TestFlight deployment..."

  - stage: PrepareBuildEnvironment
    displayName: 'Prepare Build Environment'
    jobs:
      - job: PrepareBuild
        displayName: 'Prepare Build Environment'
        steps:
          - task: Bash@3
            inputs:
              targetType: 'inline'
              script: |
                latest_xcode=$(ls /Applications | grep 'Xcode' | sort -Vr | head -n 1)
                if [ -n "$latest_xcode" ]; then
                  sudo xcode-select -s "/Applications/$latest_xcode"
                fi
                xcodebuild -version
          - task: Bash@3
            displayName: 'Configure iOS SDK and Build Settings'
            inputs:
              targetType: 'inline'
              script: |
                echo "=== iOS SDK Configuration ==="
                echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "User: gleidsonlm"
                echo "Xcode Version: $(xcodebuild -version)"
                echo ""
                
                echo "📱 Available iOS SDKs:"
                xcodebuild -showsdks | grep iphoneos
                echo ""
                
                # Get the latest available iOS SDK
                LATEST_IOS_SDK=$(xcodebuild -showsdks | grep iphoneos | tail -1 | awk '{print $NF}')
                echo "🎯 Latest available iOS SDK: $LATEST_IOS_SDK"
                
                # Extract iOS version from SDK
                IOS_VERSION=$(echo "$LATEST_IOS_SDK" | sed 's/iphoneos//')
                echo "📊 iOS Version: $IOS_VERSION"
                
                # Check if iOS 17.0 or later is available (prefer stable versions)
                if xcodebuild -showsdks | grep -q "iphoneos17"; then
                  TARGET_SDK="iphoneos17.0"
                  TARGET_VERSION="17.0"
                  echo "✅ Using iOS 17.0 SDK (stable)"
                elif xcodebuild -showsdks | grep -q "iphoneos16"; then
                  TARGET_SDK="iphoneos16.0"
                  TARGET_VERSION="16.0"
                  echo "✅ Using iOS 16.0 SDK (stable)"
                else
                  TARGET_SDK="$LATEST_IOS_SDK"
                  TARGET_VERSION="$IOS_VERSION"
                  echo "✅ Using latest available SDK: $TARGET_SDK"
                fi
                
                # Set variables for build tasks
                echo "##vso[task.setvariable variable=targetIOSSDK]$TARGET_SDK"
                echo "##vso[task.setvariable variable=targetIOSVersion]$TARGET_VERSION"
                
                echo ""
                echo "🔧 Build Configuration:"
                echo "   Target SDK: $TARGET_SDK"
                echo "   iOS Version: $TARGET_VERSION"
                echo "   Deployment Target: Will be set to $TARGET_VERSION"
                
                # Validate available simulators and devices
                echo ""
                echo "📱 Available destinations:"
                xcodebuild -showdestinations -scheme businesscard -workspace "$(xcWorkspacePath)" 2>/dev/null || \
                xcodebuild -showdestinations -scheme businesscard -project "$(xcodeProjectPath)" 2>/dev/null || \
                echo "⚠️ Could not enumerate destinations (will use generic/platform=iOS)"
                
                echo ""
                echo "✅ iOS SDK configuration completed"
                
  - stage: Build
    displayName: 'Build and Package iOS Application'
    dependsOn: PrepareBuildEnvironment
    condition: succeeded('PrepareBuildEnvironment')
    jobs:
    - job: BuildIOS
      displayName: 'Build iOS Application'
      steps:
      # Download secure files
      - task: DownloadSecureFile@1
        name: certificate
        displayName: 'Download Distribution Certificate'
        inputs:
          secureFile: 'distribution-certificate.p12'
      
      - task: DownloadSecureFile@1
        name: provisioningProfile
        displayName: 'Download Provisioning Profile'
        inputs:
          secureFile: 'distribution-profile.mobileprovision'
      
      - task: DownloadSecureFile@1
        name: appStoreKey
        displayName: 'Download App Store Connect API Key'
        inputs:
          secureFile: 'AuthKey_$(APP_STORE_CONNECT_KEY_ID).p8'
      
      - task: Bash@3
        displayName: 'Create or Validate ExportOptions.plist'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== ExportOptions.plist Configuration ==="
            
            EXPORT_OPTIONS_PATH="ExportOptions.plist"
            
            if [ ! -f "$EXPORT_OPTIONS_PATH" ]; then
              echo "📝 Creating ExportOptions.plist..."
              cat > "$EXPORT_OPTIONS_PATH" << EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>teamID</key>
                <string>$(APPLE_TEAM_ID)</string>
                <key>uploadBitcode</key>
                <false/>
                <key>uploadSymbols</key>
                <true/>
                <key>compileBitcode</key>
                <false/>
                <key>signingStyle</key>
                <string>manual</string>
                <key>signingCertificate</key>
                <string>Apple Distribution</string>
                <key>provisioningProfiles</key>
                <dict>
                    <key>$(bundleId)</key>
                    <string>$(APPLE_PROV_PROFILE_NAME)</string>
                </dict>
                <key>destination</key>
                <string>export</string>
            </dict>
            </plist>
            EOF
              echo "✅ ExportOptions.plist created"
            else
              echo "✅ ExportOptions.plist already exists"
            fi
            
            echo "📄 ExportOptions.plist content:"
            cat "$EXPORT_OPTIONS_PATH"
            
      # Validate project structure first
      - task: Bash@3
        displayName: 'Validate Project Structure and Environment'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== Build Environment Validation ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "User: gleidsonlm"
            echo "Xcode Version: $(xcodebuild -version | head -1)"
            echo ""
            
            echo "📁 Repository structure:"
            ls -la
            echo ""
            
            echo "📁 Contents of businesscard directory:"
            ls -la businesscard/
            echo ""
            
            echo "🔍 Comprehensive Xcode project discovery:"
            WORKSPACE_PATH=""
            PROJECT_PATH=""
            
            # Search for all possible Xcode project structures
            echo "Searching for workspace files..."
            find . -name "*.xcworkspace" -type d | while read workspace; do
              echo "  Found workspace: $workspace"
            done
            
            echo "Searching for project files..."
            find . -name "*.xcodeproj" -type d | while read project; do
              echo "  Found project: $project"
            done
            
            # Updated discovery logic based on actual structure
            if [ -f "businesscard/businesscard.xcworkspace/contents.xcworkspacedata" ]; then
              WORKSPACE_PATH="businesscard/businesscard.xcworkspace"
              echo "✅ Found nested workspace: $WORKSPACE_PATH"
            elif [ -f "businesscard.xcworkspace/contents.xcworkspacedata" ]; then
              WORKSPACE_PATH="businesscard.xcworkspace"
              echo "✅ Found workspace: $WORKSPACE_PATH"
            elif [ -f "businesscard/businesscard.xcodeproj/project.pbxproj" ]; then
              PROJECT_PATH="businesscard/businesscard.xcodeproj"
              echo "✅ Found nested project: $PROJECT_PATH"
            elif [ -f "businesscard.xcodeproj/project.pbxproj" ]; then
              PROJECT_PATH="businesscard.xcodeproj"
              echo "✅ Found project: $PROJECT_PATH"
            elif [ -d "businesscard" ]; then
              # Let's explore what's actually in the businesscard directory
              echo "🔍 Exploring businesscard directory structure:"
              find businesscard -name "*.xcodeproj" -o -name "*.xcworkspace" | head -5
              
              # Try to find any project file in businesscard directory
              NESTED_PROJECT=$(find businesscard -name "*.xcodeproj" | head -1)
              NESTED_WORKSPACE=$(find businesscard -name "*.xcworkspace" | head -1)
              
              if [ -n "$NESTED_WORKSPACE" ]; then
                WORKSPACE_PATH="$NESTED_WORKSPACE"
                echo "✅ Found workspace in subdirectory: $WORKSPACE_PATH"
              elif [ -n "$NESTED_PROJECT" ]; then
                PROJECT_PATH="$NESTED_PROJECT"
                echo "✅ Found project in subdirectory: $PROJECT_PATH"
              else
                echo "❌ ERROR: No Xcode workspace or project found in any expected location"
                echo ""
                echo "📋 Debug Information:"
                echo "Contents of current directory:"
                ls -la
                echo ""
                echo "Contents of businesscard directory:"
                ls -la businesscard/ 2>/dev/null || echo "businesscard directory not accessible"
                echo ""
                echo "All .xcodeproj and .xcworkspace files in repository:"
                find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -10
                exit 1
              fi
            else
              echo "❌ ERROR: No businesscard directory found"
              exit 1
            fi
            
            # Set variables for subsequent steps
            if [ -n "$WORKSPACE_PATH" ]; then
              echo "##vso[task.setvariable variable=xcWorkspacePath]$WORKSPACE_PATH"
              echo "##vso[task.setvariable variable=useWorkspace]true"
              
              echo ""
              echo "📋 Workspace schemes and targets:"
              xcodebuild -workspace "$WORKSPACE_PATH" -list || echo "Failed to list workspace contents"
            else
              echo "##vso[task.setvariable variable=xcodeProjectPath]$PROJECT_PATH"
              echo "##vso[task.setvariable variable=useWorkspace]false"
              
              echo ""
              echo "📋 Project schemes and targets:"
              xcodebuild -project "$PROJECT_PATH" -list || echo "Failed to list project contents"
            fi
            
            # Validate assets - look in the actual project directory
            echo ""
            echo "🎨 Asset validation:"
            ASSETS_PATH=$(find . -name "Assets.xcassets" | head -1)
            if [ -n "$ASSETS_PATH" ]; then
              echo "✅ Assets found: $ASSETS_PATH"
              # Check for common required assets
              if [ -d "$ASSETS_PATH/AppIcon.appiconset" ]; then
                echo "✅ App Icon found"
              else
                echo "⚠️ App Icon not found in $ASSETS_PATH - checking contents:"
                ls -la "$ASSETS_PATH" | head -10
              fi
            else
              echo "⚠️ No Assets.xcassets found - searching for image assets:"
              find . -name "*.imageset" -o -name "*.appiconset" | head -5
            fi
            
            # Check for Info.plist files
            echo ""
            echo "📋 Info.plist validation:"
            find . -name "Info.plist" | while read plist; do
              echo "  Found Info.plist: $plist"
            done
            
            echo ""
            echo "✅ Project structure validation completed"
            
            # Clean up any existing IPA files to ensure fresh build
            if [ -f "BusinessCard.ipa" ]; then
              echo "🧹 Removing existing IPA file for fresh build"
              rm -f BusinessCard.ipa
            fi
            
      # Install certificate and provisioning profile
      - task: InstallAppleCertificate@2
        displayName: 'Install Distribution Certificate'
        inputs:
          certSecureFile: 'distribution-certificate.p12'
          certPwd: '$(APPLE_CERTIFICATE_PASSWORD)'
          keychain: 'temp'
      
      - task: InstallAppleProvisioningProfile@1
        displayName: 'Install Provisioning Profile'
        inputs:
          provisioningProfileLocation: 'secureFiles'
          provProfileSecureFile: 'distribution-profile.mobileprovision'
      
      # Build and sign with dynamic project path
      - task: Xcode@5
        displayName: 'Build and Archive iOS App (Workspace)'
        condition: eq(variables['useWorkspace'], 'true')
        inputs:
          actions: 'archive'
          scheme: 'businesscard'
          sdk: '$(targetIOSSDK)'
          configuration: 'Release'
          xcWorkspacePath: '$(xcWorkspacePath)'
          archivePath: '$(Agent.BuildDirectory)/businesscard.xcarchive'
          exportPath: '$(Agent.BuildDirectory)/export'
          exportOptions: 'plist'
          exportOptionsPlist: 'ExportOptions.plist'
          signingOption: 'manual'
          signingIdentity: 'Apple Distribution'
          provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'
          args: 'IPHONEOS_DEPLOYMENT_TARGET=$(targetIOSVersion) -allowProvisioningUpdates'
          useXcpretty: false

      - task: Xcode@5
        displayName: 'Build and Archive iOS App (Project)'
        condition: eq(variables['useWorkspace'], 'false')
        inputs:
          actions: 'archive'
          scheme: 'businesscard'
          sdk: '$(targetIOSSDK)'
          configuration: 'Release'
          xcodeProjectPath: '$(xcodeProjectPath)'
          archivePath: '$(Agent.BuildDirectory)/businesscard.xcarchive'
          exportPath: '$(Agent.BuildDirectory)/export'
          exportOptions: 'plist'
          exportOptionsPlist: 'ExportOptions.plist'
          signingOption: 'manual'
          signingIdentity: 'Apple Distribution'
          provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'
          args: 'IPHONEOS_DEPLOYMENT_TARGET=$(targetIOSVersion) -allowProvisioningUpdates'
          useXcpretty: false

      - task: Bash@3
        displayName: 'Validate Build Output'
        condition: always()
        inputs:
          targetType: 'inline'
          script: |
            echo "=== Build Output Validation ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            
            echo "📁 Build directory contents:"
            ls -la "$(Agent.BuildDirectory)/" || echo "Build directory not found"
            echo ""
            
            echo "📦 Archive validation:"
            ARCHIVE_PATH="$(Agent.BuildDirectory)/businesscard.xcarchive"
            if [ -d "$ARCHIVE_PATH" ]; then
              echo "✅ Archive found: $ARCHIVE_PATH"
              echo "📋 Archive contents:"
              ls -la "$ARCHIVE_PATH/" | head -10
              
              # Check for app bundle in archive
              APP_PATH="$ARCHIVE_PATH/Products/Applications"
              if [ -d "$APP_PATH" ]; then
                echo "✅ Applications folder found"
                ls -la "$APP_PATH/"
              else
                echo "❌ Applications folder not found in archive"
              fi
            else
              echo "❌ Archive not found at: $ARCHIVE_PATH"
              echo ""
              echo "🔍 Looking for archives in build directory:"
              find "$(Agent.BuildDirectory)" -name "*.xcarchive" -type d | head -5
            fi
            
            echo ""
            echo "📤 Export directory validation:"
            EXPORT_PATH="$(Agent.BuildDirectory)/export"
            if [ -d "$EXPORT_PATH" ]; then
              echo "✅ Export directory found: $EXPORT_PATH"
              echo "📋 Export contents:"
              ls -la "$EXPORT_PATH/" || echo "Cannot list export contents"
            else
              echo "❌ Export directory not found"
              echo "Creating export directory for subsequent steps..."
              mkdir -p "$EXPORT_PATH"
            fi

      # Extract and validate build metadata
      - task: Bash@3
        displayName: 'Extract Build Metadata and Validate IPA'
        inputs:
          targetType: 'inline'
          script: |
            #!/bin/bash
            set -e
            
            echo "=== Build Metadata Extraction ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "User: gleidsonlm"
            echo "Build Number: $(Build.BuildNumber)"
            echo ""
            
            # Locate the built IPA - check multiple possible locations
            IPA_PATHS=(
              "$(Agent.BuildDirectory)/export/businesscard.ipa"
              "$(Agent.BuildDirectory)/export/BusinessCard.ipa"
              "$(Agent.BuildDirectory)/businesscard.ipa"
              "$(Agent.BuildDirectory)/BusinessCard.ipa"
            )
            
            IPA_PATH=""
            for path in "${IPA_PATHS[@]}"; do
              if [ -f "$path" ]; then
                IPA_PATH="$path"
                echo "✅ IPA found: $IPA_PATH"
                break
              fi
            done
            
            if [ -z "$IPA_PATH" ]; then
              echo "❌ ERROR: IPA file not found at any expected location"
              echo "Expected locations:"
              printf '%s\n' "${IPA_PATHS[@]}" | sed 's/^/  /'
              echo ""
              echo "Contents of $(Agent.BuildDirectory):"
              ls -la "$(Agent.BuildDirectory)/" || echo "Build directory not found"
              echo ""
              echo "Contents of $(Agent.BuildDirectory)/export:"
              ls -la "$(Agent.BuildDirectory)/export/" || echo "Export directory not found"
              exit 1
            fi
            
            # Create export directory if it doesn't exist
            mkdir -p "$(Agent.BuildDirectory)/export"
            
            # Copy IPA to standard location for artifact publishing
            STANDARD_IPA_PATH="$(Agent.BuildDirectory)/export/businesscard.ipa"
            if [ "$IPA_PATH" != "$STANDARD_IPA_PATH" ]; then
              cp "$IPA_PATH" "$STANDARD_IPA_PATH"
              echo "📋 IPA copied to standard location: $STANDARD_IPA_PATH"
            fi
            
            # Extract app metadata from IPA
            TEMP_DIR=$(mktemp -d)
            unzip -q "$STANDARD_IPA_PATH" -d "$TEMP_DIR"
            APP_PATH=$(find "$TEMP_DIR" -name "*.app" -type d | head -1)
            
            if [ -z "$APP_PATH" ]; then
              echo "❌ ERROR: No .app bundle found in IPA"
              rm -rf "$TEMP_DIR"
              exit 1
            fi
            
            # Extract metadata
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
            BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
            
            echo "📱 App Metadata:"
            echo "   Bundle ID: $BUNDLE_ID"
            echo "   Version: $VERSION" 
            echo "   Build Number: $BUILD_NUMBER"
            
            # Validate IPA integrity
            IPA_SIZE=$(du -h "$STANDARD_IPA_PATH" | cut -f1)
            echo "   IPA Size: $IPA_SIZE"
            
            if unzip -t "$STANDARD_IPA_PATH" > /dev/null 2>&1; then
              echo "   ✅ IPA structure valid"
            else
              echo "   ❌ IPA structure invalid"
              exit 1
            fi
            
            # Create metadata file for artifact
            cat > "$(Agent.BuildDirectory)/export/build-metadata.json" << EOF
            {
              "bundleId": "$BUNDLE_ID",
              "version": "$VERSION",
              "buildNumber": "$BUILD_NUMBER",
              "buildId": "$(Build.BuildNumber)",
              "buildDate": "$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
              "gitCommit": "$(Build.SourceVersion)",
              "ipaSize": "$IPA_SIZE",
              "scheme": "businesscard",
              "configuration": "Release"
            }
            EOF
            
            # Set pipeline variables for downstream stages
            echo "##vso[task.setvariable variable=appVersion;isOutput=true]$VERSION"
            echo "##vso[task.setvariable variable=buildNumber;isOutput=true]$BUILD_NUMBER"
            echo "##vso[task.setvariable variable=bundleIdentifier;isOutput=true]$BUNDLE_ID"
            echo "##vso[task.setvariable variable=ipaPath;isOutput=true]$STANDARD_IPA_PATH"
            
            rm -rf "$TEMP_DIR"
            
            echo ""
            echo "✅ Build metadata extracted and validated successfully"
        name: extractMetadata

      # Publish build artifacts
      - task: PublishBuildArtifacts@1
        displayName: 'Publish IPA and Build Artifacts'
        inputs:
          pathToPublish: '$(Agent.BuildDirectory)/export'
          artifactName: 'ios-build-$(Build.BuildNumber)'
          artifactType: 'Container'
        condition: succeeded()

      # Create build summary
      - task: Bash@3
        displayName: 'Create Build Summary'
        inputs:
          targetType: 'inline'
          script: |
            echo "🎉 Build Stage Completed Successfully"
            echo ""
            echo "📊 Build Summary:"
            echo "   • Pipeline: $(Build.DefinitionName)"
            echo "   • Build ID: $(Build.BuildNumber)"
            echo "   • Source Branch: $(Build.SourceBranchName)"
            echo "   • Commit: $(Build.SourceVersion)"
            echo "   • App Version: $(extractMetadata.appVersion)"
            echo "   • Build Number: $(extractMetadata.buildNumber)"
            echo "   • Bundle ID: $(extractMetadata.bundleIdentifier)"
            echo ""
            echo "📦 Artifacts Published:"
            echo "   • Artifact Name: ios-build-$(Build.BuildNumber)"
            echo "   • IPA Location: businesscard.ipa"
            echo "   • Metadata: build-metadata.json"
            echo ""
            echo "🔗 Next Stage: TestFlightDeployment will use these artifacts"
        condition: succeeded()

  - stage: TestFlightDeployment
    displayName: 'TestFlight Deployment with Enhanced Authentication'
    dependsOn: 
      - AuthenticationValidation
      - Build
    condition: and(succeeded('AuthenticationValidation'), succeeded('Build'))
    variables:
      # Import variables from Build stage
      appVersion: $[ stageDependencies.Build.BuildIos.outputs['extractMetadata.appVersion'] ]
      buildNumber: $[ stageDependencies.Build.BuildIos.outputs['extractMetadata.buildNumber'] ]
      bundleIdentifier: $[ stageDependencies.Build.BuildIos.outputs['extractMetadata.bundleIdentifier'] ]
    jobs:
      - job: DeployWithFixedAuth
        displayName: 'Deploy to TestFlight with Fixed Authentication'
        steps:
          - checkout: none  # Don't checkout source code, we only need artifacts
            displayName: 'Skip Source Checkout (Using Artifacts Only)'

          # Download build artifacts from Build stage
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Build Artifacts from Build Stage'
            inputs:
              buildType: 'current'
              artifactName: 'ios-build-$(Build.BuildNumber)'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: Bash@3
            displayName: 'Validate Downloaded Artifacts and Setup Deployment'
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                set -e
                
                echo "=== Artifact Validation and Deployment Setup ==="
                echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "User: gleidsonlm"
                echo "Stage Dependencies Verified: Build stage completed successfully"
                echo ""
                
                # Define artifact paths
                ARTIFACT_DIR="$(System.ArtifactsDirectory)/ios-build-$(Build.BuildNumber)"
                IPA_PATH="$ARTIFACT_DIR/businesscard.ipa"
                METADATA_PATH="$ARTIFACT_DIR/build-metadata.json"
                
                echo "🔍 Artifact Validation:"
                echo "   Artifact Directory: $ARTIFACT_DIR"
                
                # Verify artifact directory exists
                if [ ! -d "$ARTIFACT_DIR" ]; then
                  echo "   ❌ ERROR: Artifact directory not found"
                  echo "   Expected: $ARTIFACT_DIR"
                  echo "   Available artifacts:"
                  ls -la "$(System.ArtifactsDirectory)/" || echo "   No artifacts directory found"
                  exit 1
                fi
                
                echo "   ✅ Artifact directory found"
                
                # List contents of artifact directory
                echo "   📁 Artifact contents:"
                ls -la "$ARTIFACT_DIR" | sed 's/^/      /'
                
                # Verify IPA file exists
                if [ ! -f "$IPA_PATH" ]; then
                  echo "   ❌ ERROR: IPA file not found in artifacts"
                  echo "   Expected: $IPA_PATH"
                  exit 1
                fi
                
                echo "   ✅ IPA file found: $(basename "$IPA_PATH")"
                
                # Verify metadata file exists
                if [ ! -f "$METADATA_PATH" ]; then
                  echo "   ❌ ERROR: Build metadata not found in artifacts"
                  echo "   Expected: $METADATA_PATH"
                  exit 1
                fi
                
                echo "   ✅ Build metadata found"
                
                # Load and validate metadata
                if command -v jq >/dev/null 2>&1; then
                  echo ""
                  echo "📊 Build Metadata from Artifacts:"
                  cat "$METADATA_PATH" | jq -r '
                    "   Bundle ID: " + .bundleId,
                    "   Version: " + .version,
                    "   Build Number: " + .buildNumber,
                    "   Build Date: " + .buildDate,
                    "   IPA Size: " + .ipaSize,
                    "   Git Commit: " + .gitCommit
                  '
                else
                  echo ""
                  echo "📊 Build Metadata (raw):"
                  cat "$METADATA_PATH" | sed 's/^/   /'
                fi
                
                # Validate IPA integrity
                echo ""
                echo "🔍 IPA Integrity Check:"
                IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
                echo "   Current Size: $IPA_SIZE"
                
                if unzip -t "$IPA_PATH" > /dev/null 2>&1; then
                  echo "   ✅ IPA structure valid"
                else
                  echo "   ❌ IPA structure corrupted during artifact transfer"
                  exit 1
                fi
                
                # Copy IPA to working directory for deployment task
                WORKING_IPA="./businesscard.ipa"
                cp "$IPA_PATH" "$WORKING_IPA"
                echo "   📋 IPA copied to working directory: $WORKING_IPA"
                
                # Cross-reference with stage variables
                echo ""
                echo "🔗 Stage Variable Validation:"
                echo "   App Version (from stage): $(appVersion)"
                echo "   Build Number (from stage): $(buildNumber)"
                echo "   Bundle ID (from stage): $(bundleIdentifier)"
                
                # Create enhanced release notes using artifact metadata
                cat > "./release_notes.txt" << EOF
                What to Test - BusinessCard App v$(appVersion) Build $(buildNumber)
                Deployment: Azure Pipeline Artifact-Based Deployment
                
                🏗️ Build Information:
                • Built from Pipeline: $(Build.DefinitionName) #$(Build.BuildNumber)
                • Source Branch: $(Build.SourceBranchName)
                • Git Commit: $(Build.SourceVersion)
                • Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                • Bundle Identifier: $(bundleIdentifier)
                
                🔧 Pipeline Improvements Implemented:
                • Proper stage dependencies ensuring Build completes before deployment
                • Artifact-based deployment eliminating file system dependencies
                • Enhanced validation and metadata tracking
                • Immutable build artifacts with full traceability
                
                🧪 Core Testing Areas:
                
                1. Business Card Management:
                  • Create new business cards with complete contact information
                  • Edit existing business card details and save changes
                  • Delete business cards and verify proper cleanup
                  • Test data persistence across app launches
                
                2. Contact Export & Sharing:
                  • Generate vCard files from business cards
                  • Share vCard via AirDrop, Messages, Email, and other iOS share methods
                  • Import shared vCards into iOS Contacts app
                  • Verify vCard format compatibility with other contact applications
                
                3. QR Code Functionality:
                  • Generate QR codes containing contact information
                  • Scan QR codes to import contact data into the app
                  • Test QR code sharing and display on different screen sizes
                  • Verify QR code readability across various devices and lighting conditions
                
                4. iOS Integration Testing:
                  • Native Contacts app integration and data synchronization
                  • Share sheet functionality with other iOS applications
                  • Background app refresh and data persistence
                  • Proper handling of iOS permissions (Contacts, Camera, Photos)
                
                📱 Device Testing Matrix:
                • iPhone 12 series through iPhone 15 series
                • iOS 16.0 and newer versions
                • Various accessibility settings and display configurations
                
                🔒 Security & Privacy Validation:
                • Contact data storage and encryption
                • Permissions request flow and user consent
                • Data export security (vCard generation integrity)
                • No unauthorized network communications or data collection
                
                ⚠️ Pipeline Improvements Validated:
                • Build stage artifacts properly transferred to deployment stage
                • No cross-stage file system dependencies
                • Enhanced error handling and validation
                • Complete build traceability and metadata preservation
                
                📝 Testing Guidelines:
                Focus on core contact sharing workflows and cross-device compatibility.
                Test thoroughly on your primary device and report any issues through TestFlight feedback.
                Include device model, iOS version, and specific steps to reproduce any problems.
                
                Pipeline: $(Build.BuildNumber)
                Deployment Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                Artifact Source: ios-build-$(Build.BuildNumber)
                EOF
                
                echo ""
                echo "✅ Artifact validation completed successfully"
                echo "📝 Release notes created with artifact metadata"
                echo "🚀 Ready for TestFlight deployment"

          # Enhanced AppStoreRelease@1 task using artifact-based IPA
          - task: AppStoreRelease@1
            displayName: "Deploy to TestFlight - Using Build Stage Artifacts"
            inputs:
              # API Key Authentication
              authType: "ApiKey"
              apiKeyId: "$(APP_STORE_CONNECT_KEY_ID)"
              apiKeyIssuerId: "$(APP_STORE_CONNECT_ISSUER_ID)"
              apitoken: "$(APP_STORE_CONNECT_KEY_ID_BASE64)"
              
              # Release Configuration
              releaseTrack: "TestFlight"
              appType: "iOS"
              
              # Binary and App Configuration (using artifact-based IPA)
              ipaPath: "./businesscard.ipa"  # Copied from artifacts in previous step
              appSpecificId: "$(APP_STORE_APPLE_ID)"
              
              # Release Notes and Distribution
              releaseNotes: "./release_notes.txt"
              distributedToExternalTesters: true
              externalTestersGroups: "AppdomeExternal"
              
              # Processing Options
              shouldSkipWaitingForProcessing: false
              shouldSkipSubmission: false
              installFastlane: true
              fastlaneToolsVersion: "LatestVersion"
              
            continueOnError: false

          - task: Bash@3
            displayName: 'Deployment Success Summary'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              script: |
                echo "🎉 TestFlight Deployment Completed Successfully!"
                echo ""
                echo "📱 Application Details:"
                echo "   • App Name: BusinessCard"
                echo "   • Version: $(appVersion)"
                echo "   • Build: $(buildNumber)"
                echo "   • Bundle ID: $(bundleIdentifier)"
                echo ""
                echo "🏗️ Build Pipeline Details:"
                echo "   • Pipeline: $(Build.DefinitionName)"
                echo "   • Build Number: $(Build.BuildNumber)"
                echo "   • Source Commit: $(Build.SourceVersion)"
                echo "   • Artifact Used: ios-build-$(Build.BuildNumber)"
                echo ""
                echo "✅ Pipeline Improvements Validated:"
                echo "   • Proper stage dependencies implemented"
                echo "   • Artifact-based deployment successful"
                echo "   • No file system dependencies between stages"
                echo "   • Complete build traceability maintained"
                echo ""
                echo "🔗 Next Steps:"
                echo "   1. Monitor App Store Connect for build processing"
                echo "   2. Verify TestFlight build availability"
                echo "   3. Confirm external tester group notifications"
                echo "   4. Begin comprehensive app testing"
                echo ""
                echo "📊 This deployment demonstrates best practices for:"
                echo "   • Multi-stage Azure DevOps pipelines"
                echo "   • Immutable artifact management"
                echo "   • Proper stage dependency handling"
                echo "   • Professional CI/CD pipeline architecture"

