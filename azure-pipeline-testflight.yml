                echo ""
                echo "📋 Troubleshooting Steps:"
                echo ""
                echo "1. **Verify Artifact Integrity**:"
                echo "   • Check if IPA was properly downloaded from Build stage"
                echo "   • Validate IPA file size and structure"
                echo "   • Confirm metadata matches expected values"
                echo ""
                echo "2. **Authentication Validation**:"
                echo "   • Verify App Store Connect API key is still valid"
                echo "   • Check API key permissions for TestFlight access"
                echo "   • Confirm Issuer ID and Key ID are correct"
                echo ""
                echo "3. **App Store Connect Status**:"
                echo "   • Check Apple Developer Portal for service status"
                echo "   • Verify app configuration in App Store Connect"
                echo "   • Confirm TestFlight external testing is enabled"
                echo ""
                echo "4. **Pipeline Configuration**:"
                echo "   • Review task inputs and variable references"
                echo "   • Validate secure file configurations"
                echo "   • Check for any recent Azure DevOps service issues"
                echo ""
                echo "✅ Positive Validation:"
                echo "   • Build stage completed successfully"
                echo "   • Artifacts were properly transferred between stages"
                echo "   • Stage dependencies are working correctly"
                echo "   • Pipeline architecture follows best practices"
