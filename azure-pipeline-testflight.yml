# azure-pipelines-testflight-fixed.yml
# iOS Business Card App - TestFlight Deployment Pipeline
# Version: 2.1.0 - Fixed iOS SDK compatibility and enhanced error handling
# Last Updated: 2025-08-21 14:57:11 UTC
# Author: gleidsonlm

name: BusinessCard-TestFlight-$(Date:yyyyMMdd)-$(Rev:r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - businesscard/**/*
      - ExportOptions.plist
      - azure-pipeline-testflight.yml

pr: none

pool:
  vmImage: 'macos-latest'

variables:
  - group: iOS-Signing-Assets
  - name: bundleId
    value: 'com.gleidsonlm.businesscard'
  - name: appName
    value: 'Business Card'
  - name: ipaFileName
    value: 'BusinessCard.ipa'
  - name: pipelineVersion
    value: '2.1.0'

parameters:
  - name: deploymentEnvironment
    displayName: 'Deployment Environment'
    type: string
    default: 'UAT'
    values:
      - 'UAT'
      - 'PRODUCTION'

stages:
  - stage: AuthenticationValidation
    displayName: 'Authentication Validation and Setup'
    jobs:
      - job: ValidateAPIKey
        displayName: 'Validate App Store Connect API Key'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Validate API Key Configuration'
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                set -e
                
                echo "=== App Store Connect API Key Validation ==="
                echo "Pipeline Version: $(pipelineVersion)"
                echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "User: gleidsonlm"
                echo ""
                
                # Get API key variables
                API_KEY_ID="$(myApiKeyId)"
                API_KEY_ISSUER_ID="$(myApiKeyIssuerId)"
                API_TOKEN="$(myApitoken)"
                APP_SPECIFIC_ID="$(myAppSpecificId)"
                
                echo "🔍 Validating API key components..."
                
                # Validate Key ID format (10 characters, alphanumeric)
                echo "Key ID Validation:"
                echo "   Value: $API_KEY_ID"
                echo "   Length: ${#API_KEY_ID} characters"
                
                if [[ ${#API_KEY_ID} -eq 10 ]] && [[ "$API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
                    echo "   ✅ Format valid"
                else
                    echo "   ❌ Format invalid (expected 10 uppercase alphanumeric characters)"
                    exit 1
                fi
                
                # Validate Issuer ID format (UUID)
                echo ""
                echo "Issuer ID Validation:"
                echo "   Value: $API_KEY_ISSUER_ID"
                
                if [[ "$API_KEY_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
                    echo "   ✅ Format valid (UUID)"
                else
                    echo "   ❌ Format invalid (expected UUID format)"
                    exit 1
                fi
                
                # Validate API token format
                echo ""
                echo "API Token Validation:"
                echo "   Length: ${#API_TOKEN} characters"
                
                if [[ ${#API_TOKEN} -ge 200 ]] && [[ ${#API_TOKEN} -le 600 ]]; then
                    echo "   ✅ Length valid"
                else
                    echo "   ❌ Length invalid (expected 200-600 characters)"
                    exit 1
                fi
                
                # Validate base64 format
                if echo "$API_TOKEN" | base64 -d > /dev/null 2>&1; then
                    echo "   ✅ Valid base64 format"
                else
                    echo "   ❌ Invalid base64 format"
                    exit 1
                fi
                
                # Validate App Specific ID
                echo ""
                echo "App Specific ID Validation:"
                echo "   Value: $APP_SPECIFIC_ID"
                
                if [[ "$APP_SPECIFIC_ID" =~ ^[0-9]+$ ]]; then
                    echo "   ✅ Format valid (numeric)"
                else
                    echo "   ❌ Format invalid (expected numeric)"
                    exit 1
                fi
                
                echo ""
                echo "✅ All API key components validated successfully"

  - stage: PrepareBuildEnvironment
    displayName: 'Prepare Build Environment'
    dependsOn: []
    jobs:
      - job: PrepareBuild
        displayName: 'Setup Build Environment'
        steps:
          - task: Bash@3
            displayName: 'Configure Xcode and Build Environment'
            inputs:
              targetType: 'inline'
              script: |
                echo "=== Build Environment Setup ==="
                echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo ""
                
                # Set up Xcode
                latest_xcode=$(ls /Applications | grep 'Xcode' | sort -Vr | head -n 1)
                if [ -n "$latest_xcode" ]; then
                  sudo xcode-select -s "/Applications/$latest_xcode"
                fi
                
                echo "🔧 Xcode Configuration:"
                xcodebuild -version
                echo ""
                
                echo "📱 Available iOS SDKs:"
                xcodebuild -showsdks | grep iphoneos
                echo ""
                
                echo "✅ Build environment prepared successfully"

  - stage: Build
    displayName: 'Build and Package iOS Application'
    dependsOn: PrepareBuildEnvironment
    condition: succeeded('PrepareBuildEnvironment')
    jobs:
    - job: BuildiOS
      displayName: 'Build iOS Application'
      steps:
      # Download secure files
      - task: DownloadSecureFile@1
        name: certificate
        displayName: 'Download Distribution Certificate'
        inputs:
          secureFile: 'distribution-certificate.p12'
      
      - task: DownloadSecureFile@1
        name: provisioningProfile
        displayName: 'Download Provisioning Profile'
        inputs:
          secureFile: 'distribution-profile.mobileprovision'
      
      - task: DownloadSecureFile@1
        name: appStoreKey
        displayName: 'Download App Store Connect API Key'
        inputs:
          secureFile: 'AuthKey_$(APP_STORE_CONNECT_KEY_ID).p8'

      # Create ExportOptions.plist
      - task: Bash@3
        displayName: 'Create ExportOptions.plist'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== Creating ExportOptions.plist ==="
            
            cat > "ExportOptions.plist" << EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>teamID</key>
                <string>$(APPLE_TEAM_ID)</string>
                <key>uploadBitcode</key>
                <false/>
                <key>uploadSymbols</key>
                <true/>
                <key>compileBitcode</key>
                <false/>
                <key>signingStyle</key>
                <string>manual</string>
                <key>signingCertificate</key>
                <string>Apple Distribution</string>
                <key>provisioningProfiles</key>
                <dict>
                    <key>$(bundleId)</key>
                    <string>$(APPLE_PROV_PROFILE_NAME)</string>
                </dict>
                <key>destination</key>
                <string>export</string>
            </dict>
            </plist>
            EOF
            
            echo "✅ ExportOptions.plist created successfully"
            echo "📄 Content:"
            cat ExportOptions.plist

      # Discover and validate project structure
      - task: Bash@3
        displayName: 'Discover Project Structure'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== Project Structure Discovery ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            
            echo "📁 Repository contents:"
            ls -la
            echo ""
            
            echo "📁 businesscard directory contents:"
            ls -la businesscard/
            echo ""
            
            echo "🔍 Finding Xcode project files..."
            
            # Search for project files
            WORKSPACE_PATH=""
            PROJECT_PATH=""
            
            # Look for workspace files first (preferred for dependencies)
            FOUND_WORKSPACE=$(find businesscard -name "*.xcworkspace" -type d | head -1)
            FOUND_PROJECT=$(find businesscard -name "*.xcodeproj" -type d | head -1)
            
            if [ -n "$FOUND_WORKSPACE" ]; then
              WORKSPACE_PATH="$FOUND_WORKSPACE"
              echo "✅ Found workspace: $WORKSPACE_PATH"
              
              # Validate workspace
              if [ -f "$WORKSPACE_PATH/contents.xcworkspacedata" ]; then
                echo "✅ Workspace is valid"
                echo "##vso[task.setvariable variable=xcWorkspacePath]$WORKSPACE_PATH"
                echo "##vso[task.setvariable variable=useWorkspace]true"
              else
                echo "❌ Workspace appears corrupted"
                exit 1
              fi
              
            elif [ -n "$FOUND_PROJECT" ]; then
              PROJECT_PATH="$FOUND_PROJECT"
              echo "✅ Found project: $PROJECT_PATH"
              
              # Validate project
              if [ -f "$PROJECT_PATH/project.pbxproj" ]; then
                echo "✅ Project is valid"
                echo "##vso[task.setvariable variable=xcodeProjectPath]$PROJECT_PATH"
                echo "##vso[task.setvariable variable=useWorkspace]false"
              else
                echo "❌ Project appears corrupted"
                exit 1
              fi
              
            else
              echo "❌ No Xcode workspace or project found"
              echo "🔍 Debug information:"
              find . -name "*.xcworkspace" -o -name "*.xcodeproj" | head -10
              exit 1
            fi
            
            # Validate scheme
            echo ""
            echo "📋 Validating scheme 'businesscard':"
            
            if [ -n "$WORKSPACE_PATH" ]; then
              if xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -q "businesscard"; then
                echo "✅ Scheme 'businesscard' found in workspace"
              else
                echo "❌ Scheme 'businesscard' not found"
                echo "Available schemes:"
                xcodebuild -workspace "$WORKSPACE_PATH" -list
                exit 1
              fi
            else
              if xcodebuild -project "$PROJECT_PATH" -list | grep -q "businesscard"; then
                echo "✅ Scheme 'businesscard' found in project"
              else
                echo "❌ Scheme 'businesscard' not found"
                echo "Available schemes:"
                xcodebuild -project "$PROJECT_PATH" -list
                exit 1
              fi
            fi
            
            echo ""
            echo "✅ Project structure validation completed"

      # Configure iOS SDK compatibility
      - task: Bash@3
        displayName: 'Configure iOS SDK Compatibility'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== iOS SDK Compatibility Configuration ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            
            echo "📱 Available iOS SDKs:"
            xcodebuild -showsdks | grep iphoneos
            echo ""
            
            # Find compatible iOS SDK
            # Prefer iOS 17.x for stability, fall back to available versions
            TARGET_SDK=""
            TARGET_VERSION=""
            
            if xcodebuild -showsdks | grep -q "iphoneos17"; then
              TARGET_SDK="iphoneos17.0"
              TARGET_VERSION="17.0"
              echo "✅ Using iOS 17.0 SDK (recommended for stability)"
            elif xcodebuild -showsdks | grep -q "iphoneos16"; then
              TARGET_SDK="iphoneos16.0"
              TARGET_VERSION="16.0"
              echo "✅ Using iOS 16.0 SDK (stable fallback)"
            else
              # Use the latest available
              LATEST_SDK=$(xcodebuild -showsdks | grep iphoneos | tail -1 | awk '{print $NF}')
              TARGET_SDK="$LATEST_SDK"
              TARGET_VERSION=$(echo "$LATEST_SDK" | sed 's/iphoneos//')
              echo "✅ Using latest available SDK: $TARGET_SDK"
            fi
            
            echo "##vso[task.setvariable variable=targetIOSSDK]$TARGET_SDK"
            echo "##vso[task.setvariable variable=targetIOSVersion]$TARGET_VERSION"
            
            echo ""
            echo "🎯 Build Configuration:"
            echo "   Target SDK: $TARGET_SDK"
            echo "   iOS Version: $TARGET_VERSION"
            echo "   Deployment Target: $TARGET_VERSION"
            
            echo ""
            echo "✅ iOS SDK configuration completed"

      # Install certificates and provisioning profiles
      - task: InstallAppleCertificate@2
        displayName: 'Install Distribution Certificate'
        inputs:
          certSecureFile: 'distribution-certificate.p12'
          certPwd: '$(APPLE_CERTIFICATE_PASSWORD)'
          keychain: 'temp'
      
      - task: InstallAppleProvisioningProfile@1
        displayName: 'Install Provisioning Profile'
        inputs:
          provisioningProfileLocation: 'secureFiles'
          provProfileSecureFile: 'distribution-profile.mobileprovision'

      # Build for workspace
      - task: Xcode@5
        displayName: 'Build and Archive (Workspace)'
        condition: eq(variables['useWorkspace'], 'true')
        inputs:
          actions: 'archive'
          scheme: 'businesscard'
          sdk: '$(targetIOSSDK)'
          configuration: 'Release'
          xcWorkspacePath: '$(xcWorkspacePath)'
          archivePath: '$(Agent.BuildDirectory)/businesscard.xcarchive'
          exportPath: '$(Agent.BuildDirectory)/export'
          exportOptions: 'plist'
          exportOptionsPlist: 'ExportOptions.plist'
          signingOption: 'manual'
          signingIdentity: 'Apple Distribution'
          provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'
          args: 'IPHONEOS_DEPLOYMENT_TARGET=$(targetIOSVersion) -allowProvisioningUpdates'
          useXcpretty: false

      # Build for project
      - task: Xcode@5
        displayName: 'Build and Archive (Project)'
        condition: eq(variables['useWorkspace'], 'false')
        inputs:
          actions: 'archive'
          scheme: 'businesscard'
          sdk: '$(targetIOSSDK)'
          configuration: 'Release'
          xcodeProjectPath: '$(xcodeProjectPath)'
          archivePath: '$(Agent.BuildDirectory)/businesscard.xcarchive'
          exportPath: '$(Agent.BuildDirectory)/export'
          exportOptions: 'plist'
          exportOptionsPlist: 'ExportOptions.plist'
          signingOption: 'manual'
          signingIdentity: 'Apple Distribution'
          provisioningProfileUuid: '$(APPLE_PROV_PROFILE_UUID)'
          args: 'IPHONEOS_DEPLOYMENT_TARGET=$(targetIOSVersion) -allowProvisioningUpdates'
          useXcpretty: false

      # Validate build output
      - task: Bash@3
        displayName: 'Validate Build Output'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== Build Output Validation ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            
            # Check for archive
            ARCHIVE_PATH="$(Agent.BuildDirectory)/businesscard.xcarchive"
            if [ -d "$ARCHIVE_PATH" ]; then
              echo "✅ Archive created: $ARCHIVE_PATH"
              
              # Validate archive structure
              APP_PATH="$ARCHIVE_PATH/Products/Applications"
              if [ -d "$APP_PATH" ]; then
                echo "✅ Applications folder found"
                ls -la "$APP_PATH/"
              else
                echo "❌ Applications folder missing in archive"
                echo "Archive contents:"
                ls -la "$ARCHIVE_PATH/"
                exit 1
              fi
            else
              echo "❌ Archive not found"
              echo "Build directory contents:"
              ls -la "$(Agent.BuildDirectory)/"
              exit 1
            fi
            
            # Check for exported IPA
            EXPORT_DIR="$(Agent.BuildDirectory)/export"
            if [ -d "$EXPORT_DIR" ]; then
              echo "✅ Export directory found"
              echo "Export contents:"
              ls -la "$EXPORT_DIR/"
              
              # Look for IPA files
              IPA_COUNT=$(find "$EXPORT_DIR" -name "*.ipa" | wc -l)
              if [ "$IPA_COUNT" -gt 0 ]; then
                echo "✅ IPA file(s) found: $IPA_COUNT"
                find "$EXPORT_DIR" -name "*.ipa" -exec ls -lh {} \;
              else
                echo "❌ No IPA files found"
                exit 1
              fi
            else
              echo "❌ Export directory not found"
              exit 1
            fi

      # Extract build metadata
      - task: Bash@3
        displayName: 'Extract Build Metadata'
        inputs:
          targetType: 'inline'
          script: |
            echo "=== Build Metadata Extraction ==="
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            
            # Find the IPA file
            EXPORT_DIR="$(Agent.BuildDirectory)/export"
            IPA_FILE=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)
            
            if [ -z "$IPA_FILE" ]; then
              echo "❌ No IPA file found for metadata extraction"
              exit 1
            fi
            
            echo "📱 Processing IPA: $(basename "$IPA_FILE")"
            
            # Extract metadata from IPA
            TEMP_DIR=$(mktemp -d)
            unzip -q "$IPA_FILE" -d "$TEMP_DIR"
            APP_PATH=$(find "$TEMP_DIR" -name "*.app" -type d | head -1)
            
            if [ -z "$APP_PATH" ]; then
              echo "❌ No .app bundle found in IPA"
              rm -rf "$TEMP_DIR"
              exit 1
            fi
            
            # Extract metadata using PlistBuddy
            BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
            BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
            
            echo "📊 App Metadata:"
            echo "   Bundle ID: $BUNDLE_ID"
            echo "   Version: $VERSION"
            echo "   Build Number: $BUILD_NUMBER"
            
            # Validate IPA integrity
            IPA_SIZE=$(du -h "$IPA_FILE" | cut -f1)
            echo "   IPA Size: $IPA_SIZE"
            
            if unzip -t "$IPA_FILE" > /dev/null 2>&1; then
              echo "   ✅ IPA integrity verified"
            else
              echo "   ❌ IPA integrity check failed"
              rm -rf "$TEMP_DIR"
              exit 1
            fi
            
            # Ensure standard naming
            STANDARD_IPA="$EXPORT_DIR/businesscard.ipa"
            if [ "$IPA_FILE" != "$STANDARD_IPA" ]; then
              cp "$IPA_FILE" "$STANDARD_IPA"
              echo "📋 IPA copied to standard name: businesscard.ipa"
            fi
            
            # Create metadata file
            cat > "$EXPORT_DIR/build-metadata.json" << EOF
            {
              "bundleId": "$BUNDLE_ID",
              "version": "$VERSION",
              "buildNumber": "$BUILD_NUMBER",
              "buildId": "$(Build.BuildNumber)",
              "buildDate": "$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
              "gitCommit": "$(Build.SourceVersion)",
              "ipaSize": "$IPA_SIZE",
              "scheme": "businesscard",
              "configuration": "Release",
              "pipelineVersion": "$(pipelineVersion)",
              "targetIOSSDK": "$(targetIOSSDK)"
            }
            EOF
            
            # Set output variables for deployment stage
            echo "##vso[task.setvariable variable=appVersion;isOutput=true]$VERSION"
            echo "##vso[task.setvariable variable=buildNumber;isOutput=true]$BUILD_NUMBER"
            echo "##vso[task.setvariable variable=bundleIdentifier;isOutput=true]$BUNDLE_ID"
            
            rm -rf "$TEMP_DIR"
            echo ""
            echo "✅ Build metadata extraction completed"
        name: extractMetadata

      # Publish build artifacts
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Build Artifacts'
        inputs:
          pathToPublish: '$(Agent.BuildDirectory)/export'
          artifactName: 'ios-build-$(Build.BuildNumber)'
          artifactType: 'Container'
        condition: succeeded()

      # Build completion summary
      - task: Bash@3
        displayName: 'Build Completion Summary'
        condition: succeeded()
        inputs:
          targetType: 'inline'
          script: |
            echo "🎉 Build Stage Completed Successfully!"
            echo ""
            echo "📊 Build Summary:"
            echo "   • Pipeline Version: $(pipelineVersion)"
            echo "   • Build ID: $(Build.BuildNumber)"
            echo "   • Source Branch: $(Build.SourceBranchName)"
            echo "   • Git Commit: $(Build.SourceVersion)"
            echo "   • App Version: $(extractMetadata.appVersion)"
            echo "   • Build Number: $(extractMetadata.buildNumber)"
            echo "   • Bundle ID: $(extractMetadata.bundleIdentifier)"
            echo "   • Target iOS SDK: $(targetIOSSDK)"
            echo ""
            echo "📦 Artifacts Published:"
            echo "   • Artifact Name: ios-build-$(Build.BuildNumber)"
            echo "   • IPA File: businesscard.ipa"
            echo "   • Metadata: build-metadata.json"
            echo ""
            echo "🔗 Next: TestFlightDeployment stage will use these artifacts"

  - stage: TestFlightDeployment
    displayName: 'TestFlight Deployment'
    dependsOn: 
      - AuthenticationValidation
      - Build
    condition: and(succeeded('AuthenticationValidation'), succeeded('Build'))
    variables:
      appVersion: $[ stageDependencies.Build.BuildiOS.outputs['extractMetadata.appVersion'] ]
      buildNumber: $[ stageDependencies.Build.BuildiOS.outputs['extractMetadata.buildNumber'] ]
      bundleIdentifier: $[ stageDependencies.Build.BuildiOS.outputs['extractMetadata.bundleIdentifier'] ]
    jobs:
      - job: DeployToTestFlight
        displayName: 'Deploy to TestFlight'
        steps:
          - checkout: none
            displayName: 'Skip Source Checkout (Using Artifacts)'

          # Download build artifacts
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Build Artifacts'
            inputs:
              buildType: 'current'
              artifactName: 'ios-build-$(Build.BuildNumber)'
              downloadPath: '$(System.ArtifactsDirectory)'

          # Validate and prepare artifacts
          - task: Bash@3
            displayName: 'Prepare Deployment Artifacts'
            inputs:
              targetType: 'inline'
              script: |
                echo "=== Deployment Artifact Preparation ==="
                echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo ""
                
                # Define artifact paths
                ARTIFACT_DIR="$(System.ArtifactsDirectory)/ios-build-$(Build.BuildNumber)"
                IPA_PATH="$ARTIFACT_DIR/businesscard.ipa"
                METADATA_PATH="$ARTIFACT_DIR/build-metadata.json"
                
                echo "🔍 Artifact Validation:"
                echo "   Directory: $ARTIFACT_DIR"
                
                # Verify artifact directory
                if [ ! -d "$ARTIFACT_DIR" ]; then
                  echo "   ❌ Artifact directory not found"
                  echo "   Available artifacts:"
                  ls -la "$(System.ArtifactsDirectory)/" || echo "   No artifacts found"
                  exit 1
                fi
                
                echo "   ✅ Artifact directory found"
                echo "   📁 Contents:"
                ls -la "$ARTIFACT_DIR" | sed 's/^/      /'
                
                # Verify IPA file
                if [ ! -f "$IPA_PATH" ]; then
                  echo "   ❌ IPA file not found: $IPA_PATH"
                  exit 1
                fi
                
                echo "   ✅ IPA file verified: $(basename "$IPA_PATH")"
                
                # Verify metadata file
                if [ ! -f "$METADATA_PATH" ]; then
                  echo "   ❌ Metadata file not found: $METADATA_PATH"
                  exit 1
                fi
                
                echo "   ✅ Metadata file verified"
                
                # Display metadata
                if command -v jq >/dev/null 2>&1; then
                  echo ""
                  echo "📊 Build Metadata:"
                  cat "$METADATA_PATH" | jq -r '
                    "   Bundle ID: " + .bundleId,
                    "   Version: " + .version,
                    "   Build Number: " + .buildNumber,
                    "   Build Date: " + .buildDate,
                    "   IPA Size: " + .ipaSize,
                    "   Pipeline Version: " + .pipelineVersion,
                    "   Target iOS SDK: " + .targetIOSSDK
                  '
                fi
                
                # Validate IPA integrity
                echo ""
                echo "🔍 IPA Integrity Check:"
                if unzip -t "$IPA_PATH" > /dev/null 2>&1; then
                  echo "   ✅ IPA structure valid"
                else
                  echo "   ❌ IPA structure corrupted"
                  exit 1
                fi
                
                # Copy IPA to working directory
                cp "$IPA_PATH" "./businesscard.ipa"
                echo "   📋 IPA copied to working directory"
                
                # Create release notes
                cat > "./release_notes.txt" << EOF
                Business Card App v$(appVersion) Build $(buildNumber)
                
                🏗️ Build Information:
                • Pipeline: $(Build.DefinitionName) #$(Build.BuildNumber)
                • Branch: $(Build.SourceBranchName)
                • Commit: $(Build.SourceVersion)
                • Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                • Bundle ID: $(bundleIdentifier)
                • Pipeline Version: $(pipelineVersion)
                
                🧪 Testing Focus Areas:
                
                1. Business Card Management:
                   • Create, edit, and delete business cards
                   • Verify data persistence
                   • Test form validation
                
                2. Contact Sharing:
                   • vCard generation and export
                   • Share via iOS share sheet
                   • Import into Contacts app
                
                3. QR Code Features:
                   • Generate QR codes from contact data
                   • Scan QR codes to import contacts
                   • Test on different devices
                
                4. iOS Integration:
                   • Contacts app integration
                   • Permissions handling
                   • Background app behavior
                
                📱 Device Compatibility:
                • iPhone 12 series and newer
                • iOS 16.0 and newer
                • All screen sizes and orientations
                
                🔒 Privacy & Security:
                • Contact data encryption
                • Permission requests
                • No unauthorized data collection
                
                Pipeline Version: $(pipelineVersion)
                Build: $(Build.BuildNumber)
                Deployment: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                EOF
                
                echo ""
                echo "✅ Deployment artifacts prepared successfully"

          # Deploy to TestFlight
          - task: AppStoreRelease@1
            displayName: 'Upload to TestFlight'
            inputs:
              authType: 'ApiKey'
              apiKeyId: '$(APP_STORE_CONNECT_KEY_ID)'
              apiKeyIssuerId: '$(APP_STORE_CONNECT_ISSUER_ID)'
              apitoken: '$(APP_STORE_CONNECT_KEY_ID_BASE64)'
              releaseTrack: 'TestFlight'
              appType: 'iOS'
              ipaPath: './businesscard.ipa'
              appSpecificId: '$(APP_STORE_APPLE_ID)'
              releaseNotes: './release_notes.txt'
              distributedToExternalTesters: true
              externalTestersGroups: 'AppdomeExternal'
              shouldSkipWaitingForProcessing: false
              shouldSkipSubmission: false
              installFastlane: true
              fastlaneToolsVersion: 'LatestVersion'
