trigger:
  branches:
    include:
      - main
  paths:
    include:
      - build/*.ipa

pool:
  vmImage: 'macOS-latest'

stages:
  - stage: Upload
    displayName: 'Upload to TestFlight'
    jobs:
      - job: UploadIPA
        displayName: 'Upload prebuilt IPA to TestFlight'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'
            env:
              apiKeyId: $(myApiKeyId)
              apiKeyIssuerId: $(myApiKeyIssuerId)
              apitoken: $(myApitoken)

          - task: Bash@3
            displayName: 'Validate IPA Exists'
            inputs:
              targetType: 'inline'
              script: |
                export ipaFile=$(find . -name "*.ipa" -type f | head -1)
                if [ -z "$ipaFile" ]; then
                  echo "❌ No IPA found in the repository"
                  echo "Please build locally and commit IPA to repository"
                  exit 1
                fi
                echo "✅ Found IPA: $ipaFile"
                echo "##vso[task.setvariable variable=ipaPath]$ipaFile"

          - task: AppStoreRelease@1
            displayName: "Publish to AppStore TestFlight (Fastlane)"
            inputs:
              authType: "ApiKey"
              apiKeyId: "$(apiKeyId)"
              apiKeyIssuerId: "$(apiKeyIssuerId)"
              apitoken: "$(apitoken)"
              releaseTrack: "TestFlight"
              appType: "iOS"
              ipaPath: "$ipaFile"
              appSpecificId: "$appSpecificId"
              releaseNotes: "./release.txt"
              distributedToExternalTesters: true
              externalTestersGroups: "Appdome"