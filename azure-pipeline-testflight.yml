# azure-pipelines-testflight-optimized.yml
# Production configuration incorporating customer best practices

name: TestFlight-Production-$(Date:yyyyMMdd)-$(Rev:r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - build/*.ipa

pr: none

pool:
  vmImage: 'macOS-13'

# Enhanced variable configuration for production use
variables:
  - name: bundleId
    value: 'com.gleidsonlm.businesscard'
  - name: appName
    value: 'Business Card'
  - name: ipaFileName
    value: 'BusinessCard.ipa'
  - name: deploymentEnvironment
    value: 'PRODUCTION'  # Can be parameterized for multi-environment

parameters:
  - name: env
    displayName: 'Deployment Environment'
    type: string
    default: 'PRODUCTION'
    values:
      - 'UAT'
      - 'PRODUCTION'
  - name: enableExternalTesters
    displayName: 'Distribute to External Testers'
    type: boolean
    default: true

stages:
  - stage: ProductionTestFlightDeployment
    displayName: 'Production TestFlight Deployment'
    condition: and(succeeded(), or(eq('${{ parameters.env }}', 'UAT'), eq('${{ parameters.env }}', 'PRODUCTION')))
    jobs:
      - job: DeployToTestFlight
        displayName: 'Deploy to TestFlight with Customer-Proven Configuration'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: Bash@3
            displayName: 'Enhanced Pre-Deployment Validation'
            inputs:
              targetType: 'inline'
              script: |
                #!/bin/bash
                set -e
                
                echo "=== Production TestFlight Deployment Validation ==="
                echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "User: gleidsonlm"
                echo "Environment: ${{ parameters.env }}"
                echo "External Testers: ${{ parameters.enableExternalTesters }}"
                echo ""
                
                # Enhanced IPA validation with multiple path support
                IPA_PATHS=(
                    "./build/$(ipaFileName)"
                    "./$(ipaFileName)"
                    "./build/BusinessCard.ipa"
                    "./BusinessCard.ipa"
                )
                
                IPA_FOUND=""
                for path in "${IPA_PATHS[@]}"; do
                    if [ -f "$path" ]; then
                        IPA_FOUND="$path"
                        echo "✅ IPA found: $path"
                        break
                    fi
                done
                
                if [ -z "$IPA_FOUND" ]; then
                    echo "❌ ERROR: IPA file not found in any expected location"
                    printf '%s\n' "${IPA_PATHS[@]}" | sed 's/^/   /'
                    exit 1
                fi
                
                # Ensure IPA is in root directory for AppStoreRelease@1 task
                TARGET_IPA="./$(ipaFileName)"
                if [ "$IPA_FOUND" != "$TARGET_IPA" ]; then
                    cp "$IPA_FOUND" "$TARGET_IPA"
                    echo "📋 Copied IPA to expected location: $TARGET_IPA"
                fi
                
                # Enhanced IPA metadata extraction
                TEMP_DIR=$(mktemp -d)
                unzip -q "$TARGET_IPA" -d "$TEMP_DIR"
                APP_PATH=$(find "$TEMP_DIR" -name "*.app" -type d | head -1)
                
                if [ -n "$APP_PATH" ]; then
                    BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
                    VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
                    BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
                    
                    echo "📱 IPA Metadata:"
                    echo "   Bundle ID: $BUNDLE_ID"
                    echo "   Version: $VERSION" 
                    echo "   Build: $BUILD"
                    echo "   Size: $(du -h "$TARGET_IPA" | cut -f1)"
                    
                    # Set variables for release notes
                    echo "##vso[task.setvariable variable=appVersion]$VERSION"
                    echo "##vso[task.setvariable variable=buildNumber]$BUILD"
                    echo "##vso[task.setvariable variable=bundleIdentifier]$BUNDLE_ID"
                fi
                
                rm -rf "$TEMP_DIR"
                
                # Create enhanced release notes
                cat > "./release_info.txt" << EOF
                🚀 $(appName) - Production TestFlight Deployment
                
                📦 Build Information:
                • Version: $(appVersion)
                • Build: $(buildNumber)
                • Bundle ID: $(bundleIdentifier)
                • Environment: ${{ parameters.env }}
                • Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                
                🏗️ Deployment Details:
                • Pipeline: $(Build.BuildNumber)
                • Agent: $(Agent.Name)
                • Branch: $(Build.SourceBranchName)
                • Commit: $(Build.SourceVersion)
                • External Distribution: ${{ parameters.enableExternalTesters }}
                
                ✨ Application Features:
                • Create and customize professional digital business cards
                • Generate industry-standard vCard files for seamless sharing
                • QR code generation for instant contact exchange
                • Native iOS integration with Contacts application
                • Offline functionality for reliable operation
                
                🔒 Security & Compliance:
                • Enhanced with Appdome enterprise-grade security
                • Export compliance: Standard iOS encryption only
                • Privacy-focused design with no personal data collection
                • Secure contact sharing with full user control
                
                🧪 Testing Guidelines:
                1. **Core Functionality**: Test business card creation, editing, and deletion
                2. **Sharing Workflows**: Verify vCard export, QR code generation, and sharing methods
                3. **iOS Integration**: Test Contacts app integration and AirDrop functionality
                4. **Performance**: Validate app responsiveness and offline capabilities
                5. **UI/UX**: Ensure intuitive interface and smooth user experience
                
                📝 Feedback Instructions:
                Please test all core features thoroughly and report any issues through TestFlight feedback.
                Focus on cross-device compatibility and sharing workflow reliability.
                
                🔗 Support:
                For technical issues or questions, contact the development team through TestFlight feedback.
                
                Thank you for testing the $(appName) application! 🙏
                EOF
                
                echo "✅ Enhanced release notes created: ./release_info.txt"

          # Customer-proven AppStoreRelease@1 configuration with your adaptations
          - task: AppStoreRelease@1
            displayName: "Deploy to TestFlight - Customer-Proven Configuration"
            inputs:
              authType: "ApiKey"
              apiKeyId: "$(myApiKeyId)"              # Your Azure DevOps variable name
              apiKeyIssuerId: "$(myApiKeyIssuerId)"  # Your Azure DevOps variable name  
              apitoken: "$(myApitoken)"              # Your Azure DevOps variable name
              releaseTrack: "TestFlight"
              appType: "iOS"
              ipaPath: "./$(ipaFileName)"           # Dynamic IPA path
              appSpecificId: $(myAppSpecificId)     # Direct numeric (no quotes) from Azure variable
              releaseNotes: "./release_info.txt"   # Customer-proven file name format
              distributedToExternalTesters: ${{ parameters.enableExternalTesters }}
              externalTestersGroups: "Appdome"     # Your external tester group
            condition: and(succeeded(), or(eq('${{ parameters.env }}', 'UAT'), eq('${{ parameters.env }}', 'PRODUCTION')))
            continueOnError: true  # Customer-proven resilience setting